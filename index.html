<!DOCTYPE html>
<html>
<head>

    <title>Windows Shortcut Keys A-Z</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>⚡ Windows Shortcut Keys A-Z</h1>

        <p>Master Windows. Work Faster. 🚀</p>
<div class="shortcut-grid">
        <div class="shortcut-card">
    <div class="letter">A</div>

    <div class="shortcut-info">
        <h2>Ctrl + A</h2>
        <p>Selects all items</p>
    </div>
</div>
    <div class="shortcut-card">
    <div class="letter">B</div>

    <div class="shortcut-info">
        <h2>Win + B</h2>
        <p>Focuses on the notification area</p>
    </div>
</div>
    </div>
    </header>

</body>
</html>
